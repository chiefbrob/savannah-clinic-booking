server {
    listen 80;
    listen [::]:80;
    server_name clinic.dabotap.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinic.dabotap.com;

    ssl_certificate     /etc/letsencrypt/live/clinic.dabotap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.dabotap.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # The booking app (static, hash-routed) is the site root…
    root /srv/clinic-booking/docs;
    index index.html;

    client_max_body_size 2m;
    server_tokens off;

    # …and the API lives on the same origin, so the app needs no CORS at all
    # when it is served from here.
    location ~ ^/(appointments|doctors|patients|health)(/|$) {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8100/openapi.json;
        proxy_set_header Host $host;
    }

    # Swagger UI (the app itself never links here, but reviewers might).
    location ~ ^/(docs|redoc)(/|$) {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets, with SPA fallback for the hash router.
    # no-cache (not no-store): the browser may keep a copy but must revalidate,
    # so a deploy is visible on the next load instead of waiting out a TTL.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        proxy_pass http://127.0.0.1:8100/health;
        access_log off;
    }
}
